# 혼자야 자체 서버 (노트북 1대용)
# 실행: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: honjaya
      TZ: Asia/Seoul
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honjaya"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 외부에 DB 포트를 열지 않습니다(같은 compose 네트워크의 api만 접근).
    expose:
      - "5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/honjaya
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      ANON_KEY: ${ANON_KEY:-}
      SERVICE_KEY: ${SERVICE_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 마케팅 문자 발송(P7). .env 값은 아래 줄이 있어야 컨테이너로 전달됩니다.
      # (server/.env 는 이미지에 들어가지 않습니다 — .dockerignore)
      # 실제 발송은 MESSAGING_PROVIDER=solapi + 키 3종이 모두 있어야 켜집니다.
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-dryrun}
      MESSAGING_SENDER: ${MESSAGING_SENDER:-}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      TZ: Asia/Seoul
      # P12 — Discord 봇은 별도 컨테이너입니다. api 는 내부 주소로만 요청을 넘깁니다.
      # 봇이 꺼져 있어도 api 는 정상 기동합니다(봇 의존성 없음).
      BOT_API_URL: http://bot:4100
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN:-}
      BOT_TIMEOUT_MS: ${BOT_TIMEOUT_MS:-15000}
      # P14 — ARC SAFETY 증빙 파일 저장 경로(컨테이너 안). 호스트의 ./arc-files 와 연결됩니다.
      ARC_FILES_DIR: ${ARC_FILES_DIR:-/app/arc-files}
      # 민감 건강정보 암호화 키. DB 덤프·백업에는 포함되지 않으므로 오프라인 사본을 보관하세요.
      ARC_FIELD_KEY: ${ARC_FIELD_KEY:-}
    volumes:
      # P14 — 증빙 사진·영수증·서명본. 호스트 server/arc-files 에 남기므로 봇이 /src 로 읽어
      # 05:00 서버 번들 백업에 함께 담깁니다(이름을 backups/csv 로 바꾸면 백업에서 제외됩니다).
      - ./arc-files:/app/arc-files
    # 프런트엔드는 Vercel 이 서빙하므로 API 는 호스트 로컬(Funnel)에서만 보이면 됩니다.
    # 같은 Wi-Fi 의 폰에서 http://<노트북 IP>:3000 으로 직접 확인하려면 "3000:3000" 으로 바꾸세요.
    ports:
      - "127.0.0.1:3000:3000"

  # P12 — Discord 관리봇. DISCORD_BOT_TOKEN 은 이 컨테이너에만 존재합니다.
  # 외부로 포트를 열지 않으므로 같은 compose 네트워크의 api 만 접근할 수 있습니다.
  # 설정이 비어 있어도 죽지 않고 "미설정" 상태로 대기합니다.
  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/honjaya
      DB_POOL_MAX: ${BOT_DB_POOL_MAX:-4}
      BOT_PORT: 4100
      BOT_HOST: 0.0.0.0
      BOT_INTERNAL_TOKEN: ${BOT_INTERNAL_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Seoul
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_OWNER_USER_ID: ${DISCORD_OWNER_USER_ID:-}
      DISCORD_BACKUP_CHANNEL_ID: ${DISCORD_BACKUP_CHANNEL_ID:-}
      DISCORD_ANNOUNCE_CHANNEL_ID: ${DISCORD_ANNOUNCE_CHANNEL_ID:-}
      BACKUP_DIR: /backups
      # P12B-1 — 서버 코드·설정 백업 대상(읽기 전용 마운트). 비우면 서버 백업만 건너뜁니다.
      BACKUP_SOURCE_DIR: /src
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_SCRATCH_DB: ${BACKUP_SCRATCH_DB:-honjaya_verify}
      BACKUP_VERIFY_TIMEOUT_MS: ${BACKUP_VERIFY_TIMEOUT_MS:-600000}
      BACKUP_SCHEDULER_POLL_MS: ${BACKUP_SCHEDULER_POLL_MS:-60000}
      DISCORD_MAX_UPLOAD_MB: ${DISCORD_MAX_UPLOAD_MB:-20}
    volumes:
      # 암호화된 백업 파일 임시 보관 위치(호스트에도 남겨 두면 복구가 쉽습니다).
      - ./backups:/backups
      # 저장소 전체를 읽기 전용으로 붙입니다. 봇은 여기서 tar 만 만들고 아무것도 쓰지 않습니다.
      # (.env 는 마운트는 되지만 serverBundle 이 목록에서 제외하므로 백업에 들어가지 않습니다.)
      - ../:/src:ro
    expose:
      - "4100"

  # 최초 1회 스키마 적용: docker compose run --rm migrate
  migrate:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/honjaya
      TZ: Asia/Seoul
    # 스키마/패치 SQL은 레포의 supabase/ 폴더에 있으므로 읽기 전용으로 붙입니다.
    volumes:
      - ../supabase:/supabase:ro
    command: ["node", "scripts/apply-schema.mjs"]

  # Supabase CSV 백업 가져오기 (멱등, 여러 번 실행해도 안전)
  #   mkdir -p csv && cp ~/supabase-export/*_rows*.csv csv/
  #   docker compose run --rm import
  import:
    build: .
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/honjaya
      TZ: Asia/Seoul
    volumes:
      - ${CSV_DIR:-./csv}:/csv:ro
    command: ["node", "scripts/import-supabase-export.mjs", "--dir", "/csv"]
