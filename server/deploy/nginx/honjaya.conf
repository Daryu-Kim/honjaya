# 혼자야(honjaya) 프런트엔드 + API 프록시 설정
#
# docker-compose 의 `web` 서비스가 이 파일을 /etc/nginx/conf.d/default.conf 로 물려서 사용합니다.
# 같은 오리진에서 /rest/v1 과 /api 를 프록시하므로 브라우저 CORS/프리플라이트가 발생하지 않습니다.
#
# 호스트에 nginx 를 직접 설치해서 쓸 경우:
#   1) 아래 resolver 줄을 삭제(또는 127.0.0.11 -> 공유기 DNS) 하고
#   2) $honjaya_api 값을 http://127.0.0.1:3000 으로 바꾸고
#   3) root 를 실제 dist 경로로 바꾸면 됩니다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API bodyLimit(8MB) 보다 여유 있게
    client_max_body_size 12m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    # Docker 내장 DNS. api 컨테이너를 재생성하면 IP 가 바뀌므로 매번 다시 조회합니다.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $honjaya_api http://api:3000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- API (PostgREST 호환 CRUD) ----
    location /rest/v1/ {
        proxy_pass $honjaya_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- API (RPC / SSE 실시간) ----
    # SSE 는 연결을 오래 붙잡으므로 버퍼링을 끄고 타임아웃을 길게 둡니다.
    location /api/ {
        proxy_pass $honjaya_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location = /health {
        proxy_pass $honjaya_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 정적 자원 ----
    # 빌드 해시가 붙는 파일(js/app.<hash>.js, css/app.<hash>.css)은 오래 캐시합니다.
    location ~* "^/(js|css)/" {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # 해시가 없는 파일(아이콘, 효과음)은 적당히만 캐시합니다.
    location ~* "^/(img|audio)/" {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # 엔트리 파일은 항상 새로 받아야 배포가 즉시 반영됩니다.
    location = /index.html {
        expires -1;
    }

    location = /service-worker.js {
        expires -1;
    }

    location = /manifest.json {
        expires -1;
    }

    # Vue Router(history 모드) 새로고침/딥링크 대응
    location / {
        try_files $uri $uri/ /index.html;
    }
}
